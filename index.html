document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"633ce25f-7dbf-4326-b5ab-304798dc73c6\"><\u002Fscript>\n<title>Case Tracker<\u002Ftitle>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <style>/* Case Tracker styles: Ecolab tokens (Acumin web fonts omitted; app uses Roboto) + portal styles */\n/* =========================================================\n   Ecolab Design System — Foundations\n   Source of truth for color, typography, spacing, radii.\n\n   Brand summary: Ecolab Blue + white drive 50–100% of layouts.\n   Acumin Pro is the print/creative typeface. Roboto is the\n   digital fallback; Arial is the system fallback.\n   ========================================================= */\n\n/* -----------------------------\n   Acumin Pro web fonts (creative + print)\n   ----------------------------- */\n:root {\n  /* ============================================================\n     COLOR — PRIMARY\n     Ecolab Blue and white should drive 50–100% of every layout.\n     Text is restricted to Ecolab Blue, white, dark gray, or black.\n     ============================================================ */\n  --ecolab-blue:       #006bd3;  /* Primary brand color */\n  --ecolab-white:      #ffffff;\n\n  /* ============================================================\n     COLOR — COMPLEMENTARY\n     Quiet blues + grays. Used to create contrast and hierarchy\n     without competing with the primary palette.\n     ============================================================ */\n  --light-blue:        #d9eaf9;\n  --medium-blue:       #80b5e9;\n  --dark-blue:         #093675;\n  --light-gray:        #efefef;\n  --gray:              #6d7279;\n  --dark-gray:         #616365;\n  --black:             #000000;\n\n  /* ============================================================\n     COLOR — FUNCTIONAL\n     Use sparingly. Primarily for internal/training pieces,\n     charts & graphs, or to highlight themes (e.g. sustainability).\n     ============================================================ */\n  --func-purple:       #813b9e;\n  --func-teal:         #4fc2b0;\n  --func-green:        #39b54a;\n  --func-red:          #df3935;\n  --func-orange:       #f17a22;\n  --func-yellow:       #ecc42f;\n\n  /* ============================================================\n     SEMANTIC SURFACES & FOREGROUNDS\n     Use these in product UI. They map to the raw tokens above.\n     ============================================================ */\n  --bg:                var(--ecolab-white);\n  --bg-subtle:         #f7f9fc;     /* Off-white wash for sections */\n  --bg-muted:          var(--light-gray);\n  --bg-inverse:        var(--ecolab-blue);\n  --bg-deep:           var(--dark-blue);\n\n  --surface:           #ffffff;\n  --surface-tint:      #f3f7fc;     /* Card hover / row hover on white */\n  --surface-border:    #e2e8ef;\n\n  --fg:                #1a1d21;     /* Body text — near-black, not pure */\n  --fg-strong:         #000000;\n  --fg-muted:          var(--gray);\n  --fg-subtle:         #8a8f96;\n  --fg-on-blue:        var(--ecolab-white);\n  --fg-link:           var(--ecolab-blue);\n  --fg-link-hover:     var(--dark-blue);\n\n  --border:            #e2e8ef;\n  --border-strong:     #c9d2dc;\n  --divider:           #ebeef2;\n\n  /* Status / inline messaging — leans on functional palette */\n  --status-success:    var(--func-green);\n  --status-warning:    var(--func-orange);\n  --status-danger:     var(--func-red);\n  --status-info:       var(--ecolab-blue);\n\n  /* ============================================================\n     TYPOGRAPHY\n     Acumin = print/creative. Roboto = digital. Arial = fallback.\n     The summary calls out Acumin Pro Semicondensed Semibold for\n     headlines and Acumin Pro Light for body. We honor that here.\n     ============================================================ */\n  --font-headline:  \"Acumin Pro SemiCondensed\", \"Acumin Pro\", \"Roboto\", Arial, sans-serif;\n  --font-body:      \"Acumin Pro\", \"Roboto\", Arial, sans-serif;\n  --font-digital:   \"Roboto\", \"Acumin Pro\", Arial, sans-serif;\n  --font-mono:      \"Roboto Mono\", ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n\n  --fw-light:       300;\n  --fw-book:        400;\n  --fw-medium:      500;\n  --fw-semibold:    600;\n  --fw-bold:        700;\n  --fw-black:       800;\n\n  /* Type scale — tuned for marketing + product UI */\n  --fs-display:     clamp(48px, 6vw, 88px);\n  --fs-h1:          clamp(36px, 4vw, 56px);\n  --fs-h2:          clamp(28px, 3vw, 40px);\n  --fs-h3:          24px;\n  --fs-h4:          20px;\n  --fs-body-lg:     18px;\n  --fs-body:        16px;\n  --fs-body-sm:     14px;\n  --fs-caption:     12px;\n  --fs-eyebrow:     12px;\n\n  --lh-tight:       1.05;\n  --lh-snug:        1.2;\n  --lh-normal:      1.45;\n  --lh-relaxed:     1.6;\n\n  --tracking-tight: -0.01em;\n  --tracking-eyebrow: 0.12em;   /* All-caps eyebrow labels */\n\n  /* ============================================================\n     SPACING — 4px grid\n     ============================================================ */\n  --s-0:   0;\n  --s-1:   4px;\n  --s-2:   8px;\n  --s-3:   12px;\n  --s-4:   16px;\n  --s-5:   20px;\n  --s-6:   24px;\n  --s-8:   32px;\n  --s-10:  40px;\n  --s-12:  48px;\n  --s-16:  64px;\n  --s-20:  80px;\n  --s-24:  96px;\n\n  /* ============================================================\n     RADII — modest. Ecolab is corporate/industrial, not playful.\n     ============================================================ */\n  --r-none:  0;\n  --r-sm:    2px;\n  --r-md:    4px;\n  --r-lg:    8px;\n  --r-pill:  999px;\n\n  /* ============================================================\n     ELEVATION — quiet, near-flat. No drama.\n     ============================================================ */\n  --shadow-1: 0 1px 2px rgba(13, 38, 76, 0.06), 0 1px 1px rgba(13, 38, 76, 0.04);\n  --shadow-2: 0 4px 12px rgba(13, 38, 76, 0.08), 0 1px 2px rgba(13, 38, 76, 0.04);\n  --shadow-3: 0 12px 32px rgba(13, 38, 76, 0.12), 0 2px 6px rgba(13, 38, 76, 0.06);\n\n  /* Layout */\n  --container-max: 1280px;\n  --gutter:        24px;\n\n  /* Motion */\n  --ease-out:      cubic-bezier(0.16, 1, 0.3, 1);\n  --ease-in-out:   cubic-bezier(0.4, 0, 0.2, 1);\n  --dur-fast:      120ms;\n  --dur:           200ms;\n  --dur-slow:      360ms;\n}\n\n/* ============================================================\n   BASE / SEMANTIC ELEMENTS\n   ============================================================ */\nhtml {\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\nbody {\n  margin: 0;\n  font-family: var(--font-digital);\n  font-weight: var(--fw-light);\n  font-size: var(--fs-body);\n  line-height: var(--lh-relaxed);\n  color: var(--fg);\n  background: var(--bg);\n}\n\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-headline);\n  font-weight: var(--fw-semibold);\n  color: var(--ecolab-blue);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tracking-tight);\n  margin: 0 0 var(--s-4);\n  text-wrap: balance;\n}\n\nh1 { font-size: var(--fs-h1); line-height: var(--lh-tight); }\nh2 { font-size: var(--fs-h2); }\nh3 { font-size: var(--fs-h3); }\nh4 { font-size: var(--fs-h4); }\n\np {\n  margin: 0 0 var(--s-4);\n  font-weight: var(--fw-light);\n  text-wrap: pretty;\n}\n\na {\n  color: var(--fg-link);\n  text-decoration: none;\n  transition: color var(--dur) var(--ease-out);\n}\na:hover { color: var(--fg-link-hover); }\n\nsmall, .caption {\n  font-size: var(--fs-caption);\n  color: var(--fg-muted);\n}\n\n.eyebrow {\n  font-family: var(--font-headline);\n  font-size: var(--fs-eyebrow);\n  font-weight: var(--fw-semibold);\n  letter-spacing: var(--tracking-eyebrow);\n  text-transform: uppercase;\n  color: var(--ecolab-blue);\n}\n\ncode, pre, kbd, samp {\n  font-family: var(--font-mono);\n  font-size: 0.95em;\n}\n\nhr {\n or:var(--gray)\">{{ a.type }}<\u002Fsc-raw-td><sc-raw-td style=\"color:var(--gray)\">{{ a.wasIn }}<\u002Fsc-raw-td><sc-raw-td style=\"font-family:var(--font-mono);font-size:12px;color:var(--gray)\">{{ a.date }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <!-- AVAILABILITY -->\n      <sc-if value=\"{{ isAvail }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"main__heading\" style=\"margin-bottom:18px\"><div><h1 style=\"font-size:26px\">Availability<\u002Fh1><p class=\"sub\">Free means no overlapping request, including a {{ bufferDays }}-day turnaround after expected return.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"panel\" style=\"padding:18px 20px;margin-bottom:16px;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap\">\n          <label style=\"display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--gray)\">From<input type=\"date\" name=\"availFrom\" value=\"{{ availFrom }}\" sc-camel-on-change=\"{{ onTop }}\" style=\"padding:8px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:13px\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--gray)\">To<input type=\"date\" name=\"availTo\" value=\"{{ availTo }}\" sc-camel-on-change=\"{{ onTop }}\" style=\"padding:8px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:13px\"><\u002Flabel>\n          <span style=\"font-size:13px;color:var(--gray);padding-bottom:9px\">{{ availSummary }}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"panel\" style=\"padding:16px 20px 8px;overflow-x:auto\">\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px\">\n            <sc-for list=\"{{ availFilters }}\" as=\"f\" hint-placeholder-count=\"4\">\n              <button data-filter=\"{{ f.id }}\" sc-camel-on-click=\"{{ setAvailFilter }}\" style=\"border:1px solid {{ f.border }};background:{{ f.bg }};color:{{ f.color }};border-radius:999px;padding:4px 12px;font-size:12px;font-weight:500;cursor:pointer\">{{ f.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-raw-table class=\"svc-table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Case<\u002Fsc-raw-th><sc-raw-th>Type<\u002Fsc-raw-th><sc-raw-th>Status<\u002Fsc-raw-th><sc-raw-th>Result<\u002Fsc-raw-th><sc-raw-th>Reason<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody>\n            <sc-for list=\"{{ availRows }}\" as=\"c\" hint-placeholder-count=\"6\">\n              <sc-raw-tr class=\"clickable\" data-uid=\"{{ c.uid }}\" sc-camel-on-click=\"{{ openCase }}\"><sc-raw-td><span class=\"site\" style=\"color:var(--ecolab-blue)\">{{ c.label }}<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"color:var(--gray)\">{{ c.type }}<\u002Fsc-raw-td><sc-raw-td><span class=\"badge {{ c.badge }}\"><span class=\"pill\"><\u002Fspan>{{ c.status }}<\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"badge {{ c.freeBadge }}\">{{ c.freeLabel }}<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"color:var(--gray)\">{{ c.reason }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- REQUESTS -->\n      <sc-if value=\"{{ isReq }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"main__heading\" style=\"margin-bottom:18px\"><div><h1 style=\"font-size:26px\">Requests<\u002Fh1><p class=\"sub\">Booked requests wait here until shipped. Shipped cases live on the Dashboard; check them in from the case page. Returned and cancelled requests are under Past.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"panel\" style=\"padding:16px 20px 12px\">\n          <div style=\"display:flex;gap:8px;margin-bottom:12px\">\n            <sc-for list=\"{{ reqFilters }}\" as=\"f\" hint-placeholder-count=\"3\">\n              <button data-filter=\"{{ f.id }}\" sc-camel-on-click=\"{{ setReqFilter }}\" style=\"border:1px solid {{ f.border }};background:{{ f.bg }};color:{{ f.color }};border-radius:999px;padding:4px 12px;font-size:12px;font-weight:500;cursor:pointer\">{{ f.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px;padding-bottom:8px\">\n            <sc-for list=\"{{ reqRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n              <div style=\"border:1px solid var(--border);border-radius:4px;padding:16px 18px;background:#fff;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px\" style-hover=\"box-shadow:var(--shadow-2)\">\n                <div style=\"min-width:0\">\n                  <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px\"><span style=\"font-family:var(--font-headline);font-weight:600;font-size:16px;color:var(--fg)\">{{ r.show }}<\u002Fspan><span class=\"badge {{ r.badge }}\"><span class=\"pill\"><\u002Fspan>{{ r.status }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"font-size:13px;color:var(--gray);margin-bottom:4px\">Requested by <span style=\"color:var(--fg);font-weight:500\">{{ r.requestedBy }}<\u002Fspan><\u002Fdiv>\n                  <sc-if value=\"{{ r.needSummary }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:var(--fg);margin-bottom:10px\">Needs: {{ r.needSummary }}<\u002Fdiv><\u002Fsc-if>\n                  <div style=\"display:grid;grid-template-columns:auto auto auto auto;gap:4px 18px;font-size:12px\">\n                    <span style=\"color:var(--gray)\">Needed<\u002Fspan><span style=\"color:var(--gray)\">Shipped<\u002Fspan><span style=\"color:var(--gray)\">Expected return<\u002Fspan><span style=\"color:var(--gray)\">Returned<\u002Fspan>\n                    <span>{{ r.dateNeeded }}<\u002Fspan><span>{{ r.shippedOut }}<\u002Fspan><span style=\"color:{{ r.retColor }};font-weight:{{ r.retWeight }}\">{{ r.expectedReturn }}<\u002Fspan><span>{{ r.returnedIn }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"margin-top:14px;padding-top:12px;border-top:1px solid var(--divider)\">\n                    <p class=\"eyebrow\" style=\"margin:0 0 6px;font-size:11px\">Ship to<\u002Fp>\n                    <div style=\"font-size:13px;font-weight:500;color:var(--fg)\">{{ r.shipToName }}<\u002Fdiv>\n                    <div style=\"font-size:13px;color:var(--fg);white-space:pre-line;line-height:1.5\">{{ r.shipToAddress }}<\u002Fdiv>\n                    <div style=\"font-size:12px;color:var(--gray);margin-top:6px\">Contact: <span style=\"color:var(--fg)\">{{ r.contact }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ r.extras }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size:12px;color:var(--fg);margin:10px 0 0;line-height:1.5\"><span style=\"color:var(--gray)\">Also shipped: <\u002Fspan>{{ r.extras }}<\u002Fp><\u002Fsc-if>\n                  <sc-if value=\"{{ r.notes }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size:12px;color:var(--gray);margin:10px 0 0;line-height:1.5\">{{ r.notes }}<\u002Fp><\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"min-width:0;display:flex;flex-direction:column;gap:10px\">\n                  <div>\n                    <p class=\"eyebrow\" style=\"margin:0 0 6px;font-size:11px\">Cases &amp; tracking<\u002Fp>\n                    <div style=\"display:flex;flex-direction:column;gap:6px\">\n                      <sc-for list=\"{{ r.lines }}\" as=\"l\" hint-placeholder-count=\"1\">\n                        <div style=\"display:grid;grid-template-columns:110px 1fr;gap:8px;font-size:12px;line-height:1.5\"><a href=\"#\" data-uid=\"{{ l.uid }}\" sc-camel-on-click=\"{{ openCase }}\" style=\"font-weight:500\">{{ l.label }}<\u002Fa><span style=\"font-family:var(--font-mono);font-size:11px;color:var(--fg)\">Out: {{ l.out }}<br>Return: {{ l.ret }}<\u002Fspan><\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:auto\">\n                    <sc-if value=\"{{ r.canShip }}\" hint-placeholder-val=\"{{ false }}\"><button data-uid=\"{{ r.uid }}\" sc-camel-on-click=\"{{ openShip }}\" style=\"background:var(--ecolab-blue);color:#fff;border:0;border-radius:4px;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--dark-blue)\">Ship out<\u002Fbutton><\u002Fsc-if>\n                    <sc-if value=\"{{ r.canCheckin }}\" hint-placeholder-val=\"{{ false }}\"><button data-uid=\"{{ r.uid }}\" sc-camel-on-click=\"{{ openCheckin }}\" style=\"background:var(--ecolab-blue);color:#fff;border:0;border-radius:4px;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--dark-blue)\">Check in<\u002Fbutton><\u002Fsc-if>\n                    <button data-uid=\"{{ r.uid }}\" sc-camel-on-click=\"{{ openEditRequest }}\" style=\"background:#fff;color:var(--ecolab-blue);border:1px solid var(--ecolab-blue);border-radius:4px;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--light-blue)\">Edit<\u002Fbutton>\n                    <button data-uid=\"{{ r.uid }}\" sc-camel-on-click=\"{{ openEmail }}\" style=\"background:#fff;color:var(--ecolab-blue);border:1px solid var(--ecolab-blue);border-radius:4px;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--light-blue)\">Email<\u002Fbutton>\n                    <sc-if value=\"{{ r.canCancel }}\" hint-placeholder-val=\"{{ false }}\"><button data-uid=\"{{ r.uid }}\" sc-camel-on-click=\"{{ cancelRequest }}\" style=\"background:#fff;color:var(--gray);border:1px solid var(--border-strong);border-radius:4px;padding:6px 12px;font-size:12px;cursor:pointer\">Cancel<\u002Fbutton><\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ noReqRows }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:24px;color:var(--gray);font-size:13px;text-align:center\">No requests match this filter.<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- EQUIPMENT -->\n      <sc-if value=\"{{ isEq }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"main__heading\" style=\"margin-bottom:18px\"><div><h1 style=\"font-size:26px\">Equipment<\u002Fh1><p class=\"sub\">{{ eqSummary }} · No Case = not in any case (display/demo, removed, or spare). Unassigned stock = good spares ready to install.<\u002Fp><\u002Fdiv><button sc-camel-on-click=\"{{ openAddEquipment }}\" style=\"background:#fff;color:var(--ecolab-blue);border:1px solid var(--ecolab-blue);border-radius:4px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--light-blue)\">Add equipment<\u002Fbutton><\u002Fdiv>\n        <div>\n          <div class=\"panel\" style=\"padding:16px 20px 8px;overflow-x:auto\">\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px\">\n              <sc-for list=\"{{ eqFilters }}\" as=\"f\" hint-placeholder-count=\"5\">\n                <button data-filter=\"{{ f.id }}\" sc-camel-on-click=\"{{ setEqFilter }}\" style=\"border:1px solid {{ f.border }};background:{{ f.bg }};color:{{ f.color }};border-radius:999px;padding:4px 12px;font-size:12px;font-weight:500;cursor:pointer\">{{ f.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ groupBarOn }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;padding:10px 12px;background:var(--surface-tint);border:1px solid var(--border);border-radius:4px;font-size:13px\">\n                <span style=\"color:var(--fg)\">{{ groupSelSummary }}<\u002Fspan>\n                <input value=\"{{ groupName }}\" sc-camel-on-change=\"{{ onGroupName }}\" placeholder=\"Kit name, e.g. Flex 6 kit\" style=\"padding:6px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:13px;color:var(--fg);min-width:200px\">\n                <button sc-camel-on-click=\"{{ groupSelected }}\" style=\"background:var(--ecolab-blue);color:#fff;border:0;border-radius:4px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--dark-blue)\">Group selected<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ clearGroupSel }}\" style=\"background:#fff;color:var(--gray);border:1px solid var(--border-strong);border-radius:4px;padding:6px 12px;font-size:13px;cursor:pointer\">Clear<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-raw-table class=\"svc-table\"><sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:28px\"><\u002Fsc-raw-th><sc-raw-th>Serial / ID<\u002Fsc-raw-th><sc-raw-th>Type<\u002Fsc-raw-th><sc-raw-th>Case<\u002Fsc-raw-th><sc-raw-th>Status<\u002Fsc-raw-th><sc-raw-th>Condition<\u002Fsc-raw-th><sc-raw-th>Notes / location<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody>\n              <sc-for list=\"{{ eqRows }}\" as=\"e\" hint-placeholder-count=\"10\">\n                <sc-raw-tr class=\"clickable\" data-uid=\"{{ e.uid }}\" sc-camel-on-click=\"{{ selectEq }}\" style=\"background:{{ e.rowBg }}\"><sc-raw-td sc-camel-on-click=\"{{ stopProp }}\"><sc-if value=\"{{ e.groupable }}\" hint-placeholder-val=\"{{ false }}\"><input type=\"checkbox\" data-uid=\"{{ e.uid }}\" checked=\"{{ e.groupSel }}\" sc-camel-on-change=\"{{ toggleGroupSel }}\" title=\"Select to group\" style=\"width:15px;height:15px;cursor:pointer\"><\u002Fsc-if><\u002Fsc-raw-td><sc-raw-td><span style=\"font-family:var(--font-mono);font-size:12px\">{{ e.id }}<\u002Fspan><sc-if value=\"{{ e.groupName }}\" hint-placeholder-val=\"{{ false }}\"><span data-group=\"{{ e.groupId }}\" sc-camel-on-click=\"{{ ungroup }}\" title=\"Click to ungroup\" style=\"margin-left:8px;font-size:11px;background:var(--light-blue);color:var(--dark-blue);padding:1px 7px;border-radius:999px;cursor:pointer\">{{ e.groupName }}<\u002Fspan><\u002Fsc-if><\u002Fsc-raw-td><sc-raw-td>{{ e.type }}<\u002Fsc-raw-td><sc-raw-td style=\"white-space:nowrap\"><span style=\"color:var(--ecolab-blue);font-weight:500\">{{ e.caseLabel }}<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"white-space:nowrap\"><span class=\"badge {{ e.statusBadge }}\" style=\"background:{{ e.statusBg }};color:{{ e.statusColor }}\"><span class=\"pill\"><\u002Fspan>{{ e.status }}<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"white-space:nowrap\"><span class=\"badge {{ e.badge }}\"><span class=\"pill\"><\u002Fspan>{{ e.condition }}<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"color:var(--gray);max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\" title=\"{{ e.noteText }}\">{{ e.noteText }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- CASE DETAIL -->\n      <sc-if value=\"{{ isCase }}\" hint-placeholder-val=\"{{ false }}\">\n        <a href=\"#\" sc-camel-on-click=\"{{ backToDash }}\" style=\"font-size:13px;font-weight:500;display:inline-block;margin-bottom:12px\">← All cases<\u002Fa>\n        <div class=\"main__heading\" style=\"margin-bottom:18px;align-items:flex-start\">\n          <div>\n            <p class=\"eyebrow\" style=\"margin:0 0 4px\">{{ cd.type }}<\u002Fp>\n            <h1 style=\"font-size:30px;margin:0\">{{ cd.label }} <span style=\"font-family:var(--font-body);font-weight:300;font-size:16px;color:var(--gray)\">{{ cd.name }}<\u002Fspan><\u002Fh1>\n            <div style=\"display:flex;gap:10px;align-items:center;margin-top:8px\"><span class=\"badge {{ cd.badge }}\"><span class=\"pill\"><\u002Fspan>{{ cd.status }}<\u002Fspan><span style=\"font-size:13px;color:var(--gray)\">{{ cd.where }}<\u002Fspan><sc-if value=\"{{ cd.hasBoard }}\" hint-placeholder-val=\"{{ false }}\"><button data-uid=\"{{ cd.uid }}\" sc-camel-on-click=\"{{ toggleRemData }}\" title=\"Click to switch. Set to No when the sensors stop transmitting.\" class=\"badge {{ cd.remBadge }}\" style=\"border:0;cursor:pointer;font:inherit\"><span class=\"pill\"><\u002Fspan>REM Data: {{ cd.remDataLabel }}<\u002Fbutton><\u002Fsc-if><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end\">\n            <sc-if value=\"{{ cd.canShip }}\" hint-placeholder-val=\"{{ false }}\"><button data-uid=\"{{ cd.uid }}\" sc-camel-on-click=\"{{ openShipCase }}\" style=\"background:var(--ecolab-blue);color:#fff;border:0;border-radius:4px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--dark-blue)\">Ship<\u002Fbutton><\u002Fsc-if>\n            <sc-if value=\"{{ cd.canCheckin }}\" hint-placeholder-val=\"{{ false }}\"><button data-uid=\"{{ cd.uid }}\" sc-camel-on-click=\"{{ openCheckinCase }}\" style=\"background:var(--ecolab-blue);color:#fff;border:0;border-radius:4px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--dark-blue)\">Check in<\u002Fbutton><\u002Fsc-if>\n            <sc-if value=\"{{ cd.canInspect }}\" hint-placeholder-val=\"{{ false }}\"><button data-uid=\"{{ cd.uid }}\" sc-camel-on-click=\"{{ openInspect }}\" style=\"background:var(--ecolab-blue);color:#fff;border:0;border-radius:4px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--dark-blue)\">Run inspection<\u002Fbutton><\u002Fsc-if>\n            <button data-uid=\"{{ cd.uid }}\" sc-camel-on-click=\"{{ openAddEquipment }}\" style=\"background:#fff;color:var(--ecolab-blue);border:1px solid var(--ecolab-blue);border-radius:4px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--light-blue)\">Add equipment<\u002Fbutton>\n            <sc-if value=\"{{ cd.contentCount }}\" hint-placeholder-val=\"{{ false }}\"><button data-uid=\"{{ cd.uid }}\" sc-camel-on-click=\"{{ openEmptyCase }}\" style=\"background:#fff;color:var(--gray);border:1px solid var(--border-strong);border-radius:4px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--light-blue)\">Empty case<\u002Fbutton><\u002Fsc-if>\n            <button data-uid=\"{{ cd.uid }}\" sc-camel-on-click=\"{{ openEditCase }}\" style=\"background:#fff;color:var(--ecolab-blue);border:1px solid var(--ecolab-blue);border-radius:4px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--light-blue)\">Edit case<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ cd.flagList }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"alert alert--warn\" style=\"margin-bottom:16px;flex-direction:column;gap:6px\">\n            <h4 style=\"font-family:var(--font-headline);font-size:13px;font-weight:600;margin:0;color:#944614\">Needs review<\u002Fh4>\n            <sc-for list=\"{{ cd.flagList }}\" as=\"f\" hint-placeholder-count=\"1\"><div style=\"display:flex;gap:10px;align-items:baseline;font-size:12px\"><span style=\"flex:1\">{{ f.issue }}<\u002Fspan><button data-uid=\"{{ f.uid }}\" sc-camel-on-click=\"{{ resolveFlag }}\" style=\"background:#fff;border:1px solid var(--border-strong);border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer\">Resolve<\u002Fbutton><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <div class=\"panel\" style=\"padding:16px 20px 8px;overflow-x:auto\">\n              <div class=\"panel__header\"><h3 class=\"panel__title\">Current contents<\u002Fh3><span class=\"panel__sub\">{{ cd.contentsHint }}<\u002Fspan><\u002Fdiv>\n              <sc-raw-table class=\"svc-table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Type<\u002Fsc-raw-th><sc-raw-th>Serial / ID<\u002Fsc-raw-th><sc-raw-th>Condition<\u002Fsc-raw-th><sc-raw-th><\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody>\n                <sc-for list=\"{{ cd.contents }}\" as=\"e\" hint-placeholder-count=\"5\">\n                  <sc-raw-tr><sc-raw-td>{{ e.type }}<\u002Fsc-raw-td><sc-raw-td><span style=\"font-family:var(--font-mono);font-size:12px\">{{ e.id }}<\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"badge {{ e.badge }}\"><span class=\"pill\"><\u002Fspan>{{ e.condition }}<\u002Fspan><\u002Fsc-raw-td>\n                  <sc-raw-td style=\"text-align:right;white-space:nowrap\"><div style=\"display:inline-flex;gap:6px\"><button data-uid=\"{{ e.uid }}\" sc-camel-on-click=\"{{ openReplace }}\" style=\"background:#fff;color:var(--ecolab-blue);border:1px solid var(--ecolab-blue);border-radius:4px;padding:4px 10px;font-size:12px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--light-blue)\">Replace<\u002Fbutton><button data-uid=\"{{ e.uid }}\" sc-camel-on-click=\"{{ openMove }}\" style=\"background:#fff;color:var(--gray);border:1px solid var(--border-strong);border-radius:4px;padding:4px 10px;font-size:12px;cursor:pointer\">Move<\u002Fbutton><\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n            <\u002Fdiv>\n            <div class=\"panel\" style=\"padding:16px 20px 8px;overflow-x:auto\">\n              <div class=\"panel__header\"><h3 class=\"panel__title\">Requests<\u002Fh3><\u002Fdiv>\n              <sc-raw-table class=\"svc-table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Show<\u002Fsc-raw-th><sc-raw-th>Requested by<\u002Fsc-raw-th><sc-raw-th>Shipped<\u002Fsc-raw-th><sc-raw-th>Returned<\u002Fsc-raw-th><sc-raw-th>Tracking out / return<\u002Fsc-raw-th><sc-raw-th>Status<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody>\n                <sc-for list=\"{{ cd.requests }}\" as=\"r\" hint-placeholder-count=\"2\">\n                  <sc-raw-tr><sc-raw-td><span class=\"site\">{{ r.show }}<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>{{ r.requestedBy }}<\u002Fsc-raw-td><sc-raw-td>{{ r.shippedOut }}<\u002Fsc-raw-td><sc-raw-td>{{ r.returnedIn }}<\u002Fsc-raw-td><sc-raw-td style=\"font-family:var(--font-mono);font-size:11px;color:var(--gray)\">{{ r.tracking }}<\u002Fsc-raw-td><sc-raw-td><span class=\"badge {{ r.badge }}\"><span class=\"pill\"><\u002Fspan>{{ r.status }}<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n            <\u002Fdiv>\n            <div class=\"panel\" style=\"padding:18px 20px\">\n              <div class=\"panel__header\"><h3 class=\"panel__title\">Notes<\u002Fh3><\u002Fdiv>\n              <textarea value=\"{{ cd.notes }}\" data-uid=\"{{ cd.uid }}\" sc-camel-on-change=\"{{ onCaseNotes }}\" rows=\"4\" style=\"width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:13px;line-height:1.5;resize:vertical;color:var(--fg)\"><\u002Ftextarea>\n            <\u002Fdiv>\n            <div class=\"panel\" style=\"padding:18px 20px\">\n              <div class=\"panel__header\"><h3 class=\"panel__title\">History<\u002Fh3><span class=\"panel__sub\">{{ cd.logCount }} entries<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px;max-height:520px;overflow:auto\">\n                <sc-for list=\"{{ cd.log }}\" as=\"l\" hint-placeholder-count=\"4\">\n                  <div style=\"display:grid;grid-template-columns:82px 1fr;gap:10px;font-size:12px;line-height:1.45\"><span style=\"font-family:var(--font-mono);color:var(--gray)\">{{ l.date }}<\u002Fspan><span><strong style=\"font-weight:500\">{{ l.action }}<\u002Fstrong> · {{ l.detail }}<\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- IMPORT REVIEW -->\n      <sc-if value=\"{{ isReview }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;align-items:center\">\n          <sc-for list=\"{{ adminTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n            <div data-view=\"{{ t.id }}\" sc-camel-on-click=\"{{ goView }}\" style=\"padding:8px 14px;font-size:13px;cursor:pointer;color:{{ t.color }};font-weight:{{ t.weight }};border-bottom:2px solid {{ t.border }};margin-bottom:-1px;display:flex;align-items:center;gap:6px\"><span>{{ t.label }}<\u002Fspan><sc-if value=\"{{ t.count }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-family:var(--font-mono);font-size:11px;background:#fde9d4;color:#944614;padding:1px 7px;border-radius:999px\">{{ t.count }}<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n          <\u002Fsc-for>\n          <span style=\"margin-left:auto;margin-bottom:6px;align-self:center;font-size:11px;color:var(--gray);font-family:var(--font-mono);padding-right:12px\">v1.6.1 · 2026-10-28<\u002Fspan><button sc-camel-on-click=\"{{ openNewCase }}\" style=\"margin-bottom:6px;background:var(--ecolab-blue);color:#fff;border:0;border-radius:4px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--dark-blue)\">Add new case<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"main__heading\" style=\"margin-bottom:18px\"><div><h1 style=\"font-size:26px\">Import review<\u002Fh1><p class=\"sub\">What was mapped from the spreadsheet, and what still needs a decision.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"panel\" style=\"padding:20px 22px;margin-bottom:16px\">\n          <h3 class=\"panel__title\" style=\"margin-bottom:10px\">Mapped<\u002Fh3>\n          <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:var(--fg)\">\n            <sc-for list=\"{{ mappedNotes }}\" as=\"m\" hint-placeholder-count=\"6\"><li>{{ m }}<\u002Fli><\u002Fsc-for>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"panel\" style=\"padding:16px 20px 8px;overflow-x:auto\">\n          <div class=\"panel__header\"><h3 class=\"panel__title\">Needs your review<\u002Fh3><span class=\"panel__sub\">{{ openFlagCount }} open<\u002Fspan><\u002Fdiv>\n          <sc-raw-table class=\"svc-table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Sheet row<\u002Fsc-raw-th><sc-raw-th>Subject<\u002Fsc-raw-th><sc-raw-th>Issue<\u002Fsc-raw-th><sc-raw-th><\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody>\n            <sc-for list=\"{{ flagRows }}\" as=\"f\" hint-placeholder-count=\"6\">\n              <sc-raw-tr style=\"opacity:{{ f.opacity }}\"><sc-raw-td style=\"font-family:var(--font-mono);font-size:12px;color:var(--gray)\">{{ f.row }}<\u002Fsc-raw-td><sc-raw-td><sc-if value=\"{{ f.caseUid }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"#\" data-uid=\"{{ f.caseUid }}\" sc-camel-on-click=\"{{ openCase }}\" style=\"font-weight:500\">{{ f.subject }}<\u002Fa><\u002Fsc-if><sc-if value=\"{{ f.noCase }}\" hint-placeholder-val=\"{{ true }}\"><span>{{ f.subject }}<\u002Fspan><\u002Fsc-if><\u002Fsc-raw-td><sc-raw-td>{{ f.issue }}<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\"><button data-uid=\"{{ f.uid }}\" sc-camel-on-click=\"{{ resolveFlag }}\" style=\"background:#fff;border:1px solid var(--border-strong);border-radius:4px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--fg)\">{{ f.btn }}<\u002Fbutton><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- BACKUP -->\n      <sc-if value=\"{{ isBackup }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;align-items:center\">\n          <sc-for list=\"{{ adminTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n            <div data-view=\"{{ t.id }}\" sc-camel-on-click=\"{{ goView }}\" style=\"padding:8px 14px;font-size:13px;cursor:pointer;color:{{ t.color }};font-weight:{{ t.weight }};border-bottom:2px solid {{ t.border }};margin-bottom:-1px;display:flex;align-items:center;gap:6px\"><span>{{ t.label }}<\u002Fspan><sc-if value=\"{{ t.count }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-family:var(--font-mono);font-size:11px;background:#fde9d4;color:#944614;padding:1px 7px;border-radius:999px\">{{ t.count }}<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n          <\u002Fsc-for>\n          <span style=\"margin-left:auto;margin-bottom:6px;align-self:center;font-size:11px;color:var(--gray);font-family:var(--font-mono);padding-right:12px\">v1.6.1 · 2026-10-28<\u002Fspan><button sc-camel-on-click=\"{{ openNewCase }}\" style=\"margin-bottom:6px;background:var(--ecolab-blue);color:#fff;border:0;border-radius:4px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--dark-blue)\">Add new case<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"main__heading\" style=\"margin-bottom:18px\"><div><h1 style=\"font-size:26px\">Backup &amp; settings<\u002Fh1><p class=\"sub\">{{ storageNote }} {{ savedNote }}<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"panel\" style=\"padding:20px 22px;margin-bottom:16px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:12px\">\n            <div><h3 class=\"panel__title\" style=\"margin-bottom:4px\">Shared data (Supabase)<\u002Fh3><p style=\"font-size:13px;color:var(--gray);margin:0;max-width:640px\">Everyone on the team works from one shared database. Changes save automatically and other people's changes appear within a few seconds. No sign-in needed while testing.<\u002Fp><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px\"><span class=\"badge {{ syncBadge }}\"><span class=\"pill\"><\u002Fspan>{{ syncLabel }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;font-size:13px\">\n            <label style=\"display:flex;flex-direction:column;gap:4px;color:var(--gray)\">Supabase project URL<input name=\"sbUrl\" value=\"{{ sync.sbUrl }}\" sc-camel-on-change=\"{{ onSyncField }}\" placeholder=\"https://xxxx.supabase.co\" style=\"padding:8px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:13px;color:var(--fg)\"><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:4px;color:var(--gray)\">Publishable key<input name=\"sbKey\" value=\"{{ sync.sbKey }}\" sc-camel-on-change=\"{{ onSyncField }}\" placeholder=\"sb_publishable_…\" style=\"padding:8px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:13px;color:var(--fg)\"><\u002Flabel>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px\">\n            <button sc-camel-on-click=\"{{ syncConnect }}\" style=\"background:var(--ecolab-blue);color:#fff;border:0;border-radius:4px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--dark-blue)\">{{ syncConnectLabel }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ syncPull }}\" style=\"background:#fff;color:var(--ecolab-blue);border:1px solid var(--ecolab-blue);border-radius:4px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--light-blue)\">Reload shared data<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ syncPush }}\" style=\"background:#fff;color:var(--ecolab-blue);border:1px solid var(--ecolab-blue);border-radius:4px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--light-blue)\">Save now<\u002Fbutton>\n            <label style=\"display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg);margin-left:4px\"><input type=\"checkbox\" name=\"autoSync\" checked=\"{{ sync.autoSync }}\" sc-camel-on-change=\"{{ onSyncField }}\">Save automatically after every change<\u002Flabel>\n            <span style=\"font-size:12px;color:var(--gray);margin-left:auto\">{{ syncMsg }}<\u002Fspan>\n          <\u002Fdiv>\n          <details style=\"margin-top:14px;font-size:12px;color:var(--gray)\"><summary style=\"cursor:pointer;color:var(--ecolab-blue);font-weight:500\">How it works<\u002Fsummary><ol style=\"margin:8px 0 0;padding-left:18px;line-height:1.7\"><li>All cases, equipment, requests and history are stored as one record in the Supabase project \"Case Tracker\".<\u002Fli><li>Each change saves about a second after you make it. The app checks for teammates' changes every 10 seconds and when you return to the tab.<\u002Fli><li>If two people save at the same moment, the second save is paused and you're asked whether to keep yours or theirs.<\u002Fli><li>Use Export below for a local backup file at any time.<\u002Fli><\u002Fol><\u002Fdetails>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px\">\n          <div class=\"panel\" style=\"padding:20px 22px\">\n            <h3 class=\"panel__title\" style=\"margin-bottom:6px\">Export<\u002Fh3>\n            <p style=\"font-size:13px;color:var(--gray);margin:0 0 14px\">JSON is the full backup and the file to share. CSVs are for spreadsheets.<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:8px;align-items:flex-start\">\n              <button sc-camel-on-click=\"{{ exportJson }}\" style=\"background:var(--ecolab-blue);color:#fff;border:0;border-radius:4px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--dark-blue)\">Download JSON backup<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ exportCsvZip }}\" style=\"background:#fff;color:var(--ecolab-blue);border:1px solid var(--ecolab-blue);border-radius:4px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--light-blue)\">Download CSVs (cases, equipment, requests, log) as zip<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ exportFlatCsv }}\" style=\"background:#fff;color:var(--ecolab-blue);border:1px solid var(--ecolab-blue);border-radius:4px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--light-blue)\">Download flat CSV (one row per case, like the spreadsheet)<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"panel\" style=\"padding:20px 22px\">\n            <h3 class=\"panel__title\" style=\"margin-bottom:6px\">Import<\u002Fh3>\n            <p style=\"font-size:13px;color:var(--gray);margin:0 0 14px\">JSON replaces everything. Flat CSV adds or updates cases and equipment by ID.<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:10px;font-size:13px\">\n              <label style=\"display:flex;flex-direction:column;gap:4px;color:var(--gray)\">Restore JSON backup<input type=\"file\" accept=\".json,application/json\" sc-camel-on-change=\"{{ importJson }}\" style=\"font-size:12px\"><\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:4px;color:var(--gray)\">Import flat CSV<input type=\"file\" accept=\".csv,text/csv\" sc-camel-on-change=\"{{ importCsv }}\" style=\"font-size:12px\"><\u002Flabel>\n              <span style=\"color:var(--fg)\">{{ importMsg }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"panel\" style=\"padding:20px 22px\">\n            <h3 class=\"panel__title\" style=\"margin-bottom:6px\">Settings<\u002Fh3>\n            <div style=\"display:flex;flex-direction:column;gap:12px;font-size:13px\">\n              <label style=\"display:flex;flex-direction:column;gap:4px;color:var(--gray)\">Default email recipients / cc<input name=\"notifyCc\" value=\"{{ settings.notifyCc }}\" sc-camel-on-change=\"{{ onSetting }}\" placeholder=\"name@company.com, other@company.com\" style=\"padding:8px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:13px\"><\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:4px;color:var(--gray)\">Turnaround buffer after expected return (days)<input type=\"number\" min=\"0\" max=\"30\" name=\"bufferDays\" value=\"{{ settings.bufferDays }}\" sc-camel-on-change=\"{{ onSetting }}\" style=\"padding:8px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:13px;width:100px\"><\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:4px;color:var(--gray)\">Days past expected return before Overdue<input type=\"number\" min=\"0\" max=\"30\" name=\"overdueDays\" value=\"{{ settings.overdueDays }}\" sc-camel-on-change=\"{{ onSetting }}\" style=\"padding:8px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:13px;width:100px\"><\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"panel\" style=\"padding:20px 22px\">\n            <h3 class=\"panel__title\" style=\"margin-bottom:6px\">Reset<\u002Fh3>\n            <p style=\"font-size:13px;color:var(--gray);margin:0 0 14px\">Discard everything in this browser and reload the spreadsheet import.<\u002Fp>\n            <button sc-camel-on-click=\"{{ resetSeed }}\" style=\"background:#fff;color:#882420;border:1px solid #efb1ae;border-radius:4px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer\">Reset to spreadsheet import<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fmain>\n  <\u002Fdiv>\n\n  <!-- MODAL -->\n  <sc-if value=\"{{ modalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeModalBg }}\" style=\"position:fixed;inset:0;background:rgba(9,54,117,0.35);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow:auto;z-index:50;animation:fadeIn 200ms var(--ease-out)\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"background:#fff;border-radius:8px;box-shadow:var(--shadow-3);width:100%;max-width:{{ modalWidth }};padding:24px 28px 22px;font-size:13px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px\"><div><h2 style=\"font-size:22px;margin:0\">{{ modalTitle }}<\u002Fh2><p style=\"font-size:13px;color:var(--gray);margin:4px 0 0\">{{ modalSub }}<\u002Fp><\u002Fdiv><button sc-camel-on-click=\"{{ closeModal }}\" style=\"background:none;border:0;font-size:20px;color:var(--gray);cursor:pointer;line-height:1\">×<\u002Fbutton><\u002Fdiv>\n\n        <!-- New request -->\n        <sc-if value=\"{{ mNewRequest }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;gap:6px;align-items:center;margin-bottom:16px;font-size:12px\">\n            <span style=\"display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:{{ step1Bg }};color:{{ step1Color }};font-weight:500\">1 · Details &amp; equipment<\u002Fspan>\n            <span style=\"color:var(--border-strong)\">›<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:{{ step2Bg }};color:{{ step2Color }};font-weight:500\">2 · Assign cases<\u002Fspan>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ isStep1 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n            <label style=\"display:flex;flex-direction:column;gap:4px;color:var(--gray)\">Requested by<input name=\"requestedBy\" value=\"{{ form.requestedBy }}\" sc-camel-on-change=\"{{ onField }}\" style=\"padding:8px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:13px;color:var(--fg)\"><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:4px;color:var(--gray)\">Requester email (for notifications)<input name=\"requesterEmail\" value=\"{{ form.requesterEmail }}\" sc-camel-on-change=\"{{ onField }}\" style=\"padding:8px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:13px;color:var(--fg)\"><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:4px;color:var(--gray)\">Show / event<input name=\"show\" value=\"{{ form.show }}\" sc-camel-on-change=\"{{ onField }}\" style=\"padding:8px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:13px;color:var(--fg)\"><\u002Flabel>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n              <label style=\"display:flex;flex-direction:column;gap:4px;color:var(--gray)\">Date needed<input type=\"date\" name=\"dateNeeded\" value=\"{{ form.dateNeeded }}\" sc-camel-on-change=\"{{ onField }}\" style=\"padding:8px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:13px;color:var(--fg)\"><\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:4px;color:var(--gray)\">Expected return<input type=\"date\" name=\"expectedReturn\" value=\"{{ form.expectedReturn }}\" sc-camel-on-change=\"{{ onField }}\" style=\"padding:8px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:13px;color:var(--fg)\"><\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p class=\"eyebrow\" style=\"margin:18px 0 8px\">Ship to<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n            <label style=\"display:flex;flex-direction:column;gap:4px;color:var(--gray)\">Ship-to name (company, hotel, or person)<input name=\"shipToName\" value=\"{{ form.shipToName }}\" sc-camel-on-change=\"{{ onField }}\" style=\"padding:8px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:13px;color:var(--fg)\"><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:4px;color:var(--gray);grid-row:span 2\">Address<textarea name=\"shipToAddress\" value=\"{{ form.shipToAddress }}\" sc-camel-on-change=\"{{ onField }}\" rows=\"4\" style=\"padding:8px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:13px;color:var(--fg);resize:vertical;flex:1\"><\u002Ftextarea><\u002Flabel>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n              <label style=\"display:flex;flex-direction:column;gap:4px;color:var(--gray)\">Contact person<input name=\"contactName\" value=\"{{ form.contactName }}\" sc-camel-on-change=\"{{ onField }}\" style=\"padding:8px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:13px;color:var(--fg)\"><\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:4px;color:var(--gray)\">Contact phone<input name=\"contactPhone\" value=\"{{ form.contactPhone }}\" sc-camel-on-change=\"{{ onField }}\" style=\"padding:8px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:13px;color:var(--fg)\"><\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px\"><p class=\"eyebrow\" style=\"margin:0\">What's needed<\u002Fp><span style=\"font-size:12px;color:var(--gray)\">Free for these dates shown under each item<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <sc-for list=\"{{ needGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n              <div style=\"display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:start\">\n                <span style=\"font-size:12px;color:var(--gray);padding-top:10px\">{{ g.label }}<\u002Fspan>\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px\">\n                  <sc-for list=\"{{ g.kinds }}\" as=\"k\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 12px;border:1px solid {{ k.border }};border-radius:4px;background:{{ k.bg }}\">\n                      <span style=\"line-height:1.3\"><span style=\"font-weight:500;color:var(--fg)\">{{ k.kind }}<\u002Fspan><br><span style=\"font-size:11px;color:{{ k.freeColor }}\">{{ k.freeText }}<\u002Fspan><\u002Fspan>\n                      <span style=\"display:inline-flex;align-items:center;gap:2px;flex:none\">\n                        <button data-kind=\"{{ k.kind }}\" data-delta=\"-1\" sc-camel-on-click=\"{{ changeNeed }}\" style=\"width:26px;height:26px;border:1px solid var(--border-strong);background:#fff;border-radius:4px;cursor:pointer;color:var(--fg);font-size:14px;line-height:1\">−<\u002Fbutton>\n                        <span style=\"width:22px;text-align:center;font-weight:500;font-variant-numeric:tabular-nums\">{{ k.qty }}<\u002Fspan>\n                        <button data-kind=\"{{ k.kind }}\" data-delta=\"1\" sc-camel-on-click=\"{{ changeNeed }}\" style=\"width:26px;height:26px;border:1px solid var(--ecolab-blue);background:#fff;border-radius:4px;cursor:pointer;color:var(--ecolab-blue);font-size:14px;line-height:1\">+<\u002Fbutton>\n                      <\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ formError }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"color:#882420;font-size:12px;margin:10px 0 0\">{{ formError }}<\u002Fp><\u002Fsc-if>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px\">\n            <span style=\"font-size:12px;color:var(--gray)\">{{ needSummary }}<\u002Fspan>\n            <div style=\"display:flex;gap:8px\"><button sc-camel-on-click=\"{{ closeModal }}\" style=\"background:#fff;color:var(--gray);border:1px solid var(--border-strong);border-radius:4px;padding:8px 14px;font-size:13px;cursor:pointer\">Cancel<\u002Fbutton><button sc-camel-on-click=\"{{ toStep2 }}\" style=\"background:var(--ecolab-blue);color:#fff;border:0;border-radius:4px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--dark-blue)\">Next: assign cases<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isStep2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"font-size:13px;color:var(--gray);margin:0 0 12px\">Only Available cases are listed. Free ones are pre-selected; change any pick, or leave it for later and assign when you ship.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <sc-for list=\"{{ assignRows }}\" as=\"a\" hint-placeholder-count=\"3\">\n              <div style=\"display:grid;grid-template-columns:170px 1fr;gap:12px;align-items:center;padding:8px 12px;border:1px solid var(--border);border-radius:4px;background:{{ a.bg }}\">\n                <span style=\"font-weight:500;color:var(--fg)\">{{ a.title }}<\u002Fspan>\n                <div style=\"display:flex;flex-direction:column;gap:3px\">\n                  <sc-raw-select data-idx=\"{{ a.idx }}\" value=\"{{ a.caseUid }}\" sc-camel-on-change=\"{{ setAssign }}\" style=\"padding:7px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:13px;color:var(--fg);background:#fff\"><option value=\"\">Assign later<\u002Foption><sc-for list=\"{{ a.options }}\" as=\"o\" hint-placeholder-count=\"1\"><option value=\"{{ o.uid }}\">{{ o.text }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n                  <span style=\"font-size:11px;color:{{ a.noteColor }}\">{{ a.note }}<\u002Fspan>\n                  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px\"><input data-idx=\"{{ a.idx }}\" data-key=\"outTracking\" value=\"{{ a.outTracking }}\" sc-camel-on-change=\"{{ setAssignField }}\" placeholder=\"Outbound tracking # (optional)\" style=\"padding:7px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:12px;font-family:var(--font-mono);color:var(--fg)\"><input data-idx=\"{{ a.idx }}\" data-key=\"returnTracking\" value=\"{{ a.returnTracking }}\" sc-camel-on-change=\"{{ setAssignField }}\" placeholder=\"Return tracking # (optional)\" style=\"padding:7px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:12px;font-family:var(--font-mono);color:var(--fg)\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:4px;color:var(--gray);font-size:13px;margin-top:16px\">Other items in the shipment <span style=\"font-weight:300\">(collateral, labels, brochures — not expected back)<\u002Fspan><textarea name=\"extras\" value=\"{{ form.extras }}\" sc-camel-on-change=\"{{ onField }}\" rows=\"3\" placeholder=\"e.g. 50 Kitchen IQ brochures, 1 pack 2x1 DuraLabels\" style=\"padding:8px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:13px;color:var(--fg);font-family:inherit;resize:vertical\"><\u002Ftextarea><\u002Flabel>\n          <sc-if value=\"{{ formConflicts }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"alert alert--warn\" style=\"margin-top:14px;padding:10px 12px;font-size:12px\"><span style=\"color:#944614\">{{ formConflicts }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ formError }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"color:#882420;font-size:12px;margin:10px 0 0\">{{ formError }}<\u002Fp><\u002Fsc-if>\n          <div style=\"display:flex;justify-content:space-between;gap:8px;margin-top:18px\">\n            <button sc-cam

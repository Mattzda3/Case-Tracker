.parse(t); if (!nd.cases || !nd.equipment) throw 0; if (!confirm(`Replace all current data with ${file.name} (${nd.cases.length} cases, ${nd.equipment.length} devices)?`)) return; nd.settings = nd.settings || { notifyCc: '', bufferDays: 3, overdueDays: 3 }; nd.flags = nd.flags || []; nd.log = nd.log || []; nd.requests = nd.requests || []; localStorage.setItem(STORE, JSON.stringify(nd)); this.setState({ data: nd, importMsg: `Restored ${file.name}.`, view: 'dashboard' }); } catch (err) { this.setState({ importMsg: 'Could not read that file as a Case Tracker JSON backup.' }); } }); e.target.value = ''; },\n      importCsv: e => { const file = e.target.files[0]; if (!file) return; file.text().then(t => { const rows = parseCsv(t); if (rows.length < 2) return this.setState({ importMsg: 'CSV is empty.' }); const hdr = rows[0].map(h => h.trim()); const idx = n => hdr.findIndex(h => h.toLowerCase() === n.toLowerCase()); let added = 0, updated = 0, eqAdded = 0;\n          this.save(d => { for (const r of rows.slice(1)) { const get = n => { const i = idx(n); return i >= 0 ? (r[i] || '').trim() : ''; }; const label = get('Case ID'); if (!label) continue; let c = d.cases.find(c => c.label && c.label.toLowerCase() === label.toLowerCase()); if (!c) { c = { uid: uid('c'), label, name: get('Name'), type: get('Case Type'), status: STATUSES.includes(get('Status')) ? get('Status') : 'Available', notes: get('Notes'), remData: get('REM Data') }; d.cases.push(c); added++; this.log(d, { caseUid: c.uid, action: 'Imported (CSV)', detail: `Created from ${file.name}.` }); } else { const st = get('Status'); if (st && STATUSES.includes(st) && st !== c.status) { this.log(d, { caseUid: c.uid, action: `Status → ${st}`, detail: `From CSV import ${file.name}. Was ${c.status}.` }); c.status = st; } if (get('Name')) c.name = get('Name'); if (get('Case Type')) c.type = get('Case Type'); if (get('Notes')) c.notes = get('Notes'); updated++; }\n              for (const t of EQ_TYPES) { for (const id of get(t).split(';').map(x => x.trim()).filter(Boolean)) { let eq = d.equipment.find(x => x.id.toLowerCase() === id.toLowerCase()); if (!eq) { eq = { uid: uid('e'), id, type: t, caseUid: c.uid, condition: 'OK', notes: '' }; d.equipment.push(eq); eqAdded++; this.log(d, { caseUid: c.uid, equipmentUid: eq.uid, action: 'Added (CSV)', detail: `${t} ${id} added to ${c.label}.` }); } else if (eq.caseUid !== c.uid) { this.log(d, { caseUid: c.uid, fromCaseUid: eq.caseUid, equipmentUid: eq.uid, action: 'Moved (CSV)', detail: `${t} ${id}: ${this.caseLabel(d, eq.caseUid)} → ${c.label}.` }); eq.caseUid = c.uid; } } } } });\n          this.setState({ importMsg: `CSV: ${added} cases added, ${updated} updated, ${eqAdded} devices added.` }); }); e.target.value = ''; },\n      resetSeed: () => { if (!confirm('Discard all data in this browser and reload the spreadsheet import?')) return; const nd = buildSeed(); localStorage.setItem(STORE, JSON.stringify(nd)); this.setState({ data: nd, view: 'dashboard', caseUid: null, modal: null, form: {}, importMsg: 'Reset to spreadsheet import.' }); },\n    };\n  }\n  emailForm(r, kind) {\n    const d = this.state.data, cases = r.items.map(i => { const c = i.caseUid ? this.caseOf(d, i.caseUid) : null; return c ? `${i.kind ? i.kind + ' – ' : ''}${c.label || c.name}` : (i.kind || 'Item') + ' (case to be assigned)'; }).join(', ');\n    const cc = d.settings.notifyCc || '', to = r.requesterEmail || '';\n    const track = r.items.filter(i => i.caseUid).map(i => `${this.caseLabel(d, i.caseUid)}: ${i.outTracking || 'tracking pending'}`).join('\\n');\n    const extras = r.extras ? `\\nAlso included: ${r.extras}\\n` : ''; const addr = [r.shipToName, r.shipToAddress, r.contactName ? 'Contact: ' + [r.contactName, r.contactPhone].filter(Boolean).join(', ') : ''].filter(Boolean).join('\\n');\n    const forms = {\n      confirm: { subject: `Case request confirmed – ${r.show}`, body: `Hi ${r.requestedBy || ''},\\n\\nYour request for ${r.show} is booked.\\n\\nCases: ${cases}${extras}\\nDate needed: ${fmt(r.dateNeeded)}\\nExpected return: ${fmt(r.expectedReturn)}\\nShip to:\\n${addr || '(address pending)'}\\n\\nWe'll send tracking when the cases ship. Please return them by the expected return date so they're ready for the next show.\\n\\nThanks,\\n` },\n      shipped: { subject: `Cases shipped – ${r.show}`, body: `Hi ${r.requestedBy || ''},\\n\\nYour cases for ${r.show} shipped on ${fmt(r.shippedOut)}.\\n\\n${track}\\n${extras}\\nShip to:\\n${addr || '(address pending)'}\\n\\nExpected return: ${fmt(r.expectedReturn)}. A return label is in the box.\\n\\nThanks,\\n` },\n      overdue: { subject: `Overdue return – ${r.show}`, body: `Hi ${r.requestedBy || ''},\\n\\nThe cases from ${r.show} were expected back on ${fmt(r.expectedReturn)} and haven't been checked in yet.\\n\\nCases: ${cases}\\n\\nPlease ship them back as soon as possible and reply with the return tracking number. They're needed for upcoming requests.\\n\\nThanks,\\n` },\n    };\n    return { uid: r.uid, kind, to, cc, ...forms[kind] };\n  }\n  openEmailFor(r, kind) { if (!r) return; kind = kind || (this.overdueDays(this.state.data, r) ? 'overdue' : r.shippedOut ? 'shipped' : 'confirm'); this.setState({ modal: 'email', form: this.emailForm(r, kind) }); }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
